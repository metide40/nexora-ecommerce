<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — NEXORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo"><span class="logo__icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect class="logo__icon-bg" x="1.5" y="1.5" width="37" height="37" rx="11" stroke-width="1.5"/><path class="logo__icon-n" d="M13 28.5V11.5h2.9l7.4 12.6V11.5H26.5v17H23.6L16.2 15.9v12.6H13z"/></svg></span> NEXORA</a>
      <div class="header__actions">
        <a href="cart.html" class="header__icon-btn" aria-label="Cart">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Checkout</h1>
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <a href="cart.html">Cart</a>
        <span class="separator">/</span>
        <span>Checkout</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="checkout-layout">
      <form id="checkout-form" class="checkout-form">
        <h3>Contact Information</h3>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="you@example.com">
          <div class="form-error" id="email-error"></div>
        </div>

        <h3 style="margin-top:var(--space-xl)">Shipping Address</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First Name</label>
            <input type="text" id="first-name" class="form-input" required>
            <div class="form-error" id="first-name-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last Name</label>
            <input type="text" id="last-name" class="form-input" required>
            <div class="form-error" id="last-name-error"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="address">Street Address</label>
          <input type="text" id="address" class="form-input" required placeholder="123 Main Street">
          <div class="form-error" id="address-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="apartment">Apartment, suite, etc. (optional)</label>
          <input type="text" id="apartment" class="form-input">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="city">City</label>
            <input type="text" id="city" class="form-input" required>
            <div class="form-error" id="city-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="state">State</label>
            <input type="text" id="state" class="form-input" required>
            <div class="form-error" id="state-error"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="zip">ZIP Code</label>
            <input type="text" id="zip" class="form-input" required>
            <div class="form-error" id="zip-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone</label>
            <input type="tel" id="phone" class="form-input" required>
            <div class="form-error" id="phone-error"></div>
          </div>
        </div>

        <p style="font-size:0.8125rem;color:var(--slate);margin:var(--space-lg) 0">
          This is a demo checkout. No payment will be processed.
        </p>

        <button type="submit" class="btn btn-primary btn-lg btn-block">Place Order</button>
      </form>

      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="order-items"></div>
        <div class="summary-row" style="margin-top:var(--space-lg)">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span id="summary-shipping">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer" style="margin-top:var(--space-3xl)">
    <div class="container">
      <div class="footer__bottom" style="border:none;padding-top:0">
        <span>&copy; 2026 NEXORA. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
